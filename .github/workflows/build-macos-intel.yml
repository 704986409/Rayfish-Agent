name: Build Intel Mac package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare Rust
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup override set 1.91.0
      - name: Build Intel app and DMG
        run: bash scripts/build-macos-intel.sh
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: AgentLink-macOS-Intel
          path: |
            artifacts/macos-intel.*/AgentLink-macOS-Intel.dmg
            artifacts/macos-intel.*/AgentLink-macOS-Intel.app.zip
            artifacts/macos-intel.*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
